<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footy Sharer - WhatsApp Results & Tables</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚽</span>
        <h1 class="text-xl font-bold text-white">Footy Sharer</h1>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
        Live API Connected
      </span>
    </div>

    <!-- Controls -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Competition</label>
        <select id="leagueSelect" onchange="fetchData()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
          <option value="PL">Premier League</option>
          <option value="CL">UEFA Champions League</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center gap-6 pt-2 border-t border-slate-700/50">
        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
          <input type="checkbox" id="includeResults" checked onchange="updatePreview()" class="accent-emerald-500 w-4 h-4 rounded">
          Include Match Results
        </label>
        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
          <input type="checkbox" id="includeTable" checked onchange="updatePreview()" class="accent-emerald-500 w-4 h-4 rounded">
          Include League Table
        </label>
      </div>
    </div>

    <!-- Output Preview -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold uppercase text-slate-400">WhatsApp Text Preview</h2>
        <span id="loadingIndicator" class="hidden text-xs text-emerald-400 animate-pulse">Fetching live data...</span>
      </div>

      <textarea id="whatsappOutput" readonly rows="13" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-sm text-slate-200 outline-none resize-none focus:border-emerald-500" placeholder="Loading data..."></textarea>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
        <button onclick="copyToClipboard()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2 transition text-sm">
          📋 Copy Text
        </button>
        <button onclick="shareToWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2 transition text-sm">
          💬 Share to WhatsApp
        </button>
      </div>
    </div>

  </div>

  <script>
    // Embedded Football-Data.org API Key
    const API_KEY = "4a7648b127cb477c9617b8e5f1536bd2";

    let globalMatches = [];
    let globalStandings = [];

    window.onload = () => {
      fetchData();
    };

    async function fetchData() {
      const league = document.getElementById('leagueSelect').value;
      const loading = document.getElementById('loadingIndicator');
      const textarea = document.getElementById('whatsappOutput');

      loading.classList.remove('hidden');

      try {
        // Fetch Matches
        const matchRes = await fetch(`https://api.football-data.org/v4/competitions/${league}/matches?status=FINISHED`, {
          headers: { 'X-Auth-Token': API_KEY }
        });
        const matchData = await matchRes.json();
        globalMatches = (matchData.matches || []).slice(-5); // Get latest 5 finished matches

        // Fetch Standings
        const standingsRes = await fetch(`https://api.football-data.org/v4/competitions/${league}/standings`, {
          headers: { 'X-Auth-Token': API_KEY }
        });
        const standingsData = await standingsRes.json();
        globalStandings = standingsData.standings?.[0]?.table || [];

        updatePreview();
      } catch (err) {
        textarea.value = "⚠️ Error fetching data. Please check connection.";
        console.error(err);
      } finally {
        loading.classList.add('hidden');
      }
    }

    function updatePreview() {
      const leagueName = document.getElementById('leagueSelect').options[document.getElementById('leagueSelect').selectedIndex].text;
      const includeResults = document.getElementById('includeResults').checked;
      const includeTable = document.getElementById('includeTable').checked;

      let output = `⚽ *${leagueName.toUpperCase()} UPDATE* ⚽\n\n`;

      if (includeResults && globalMatches.length > 0) {
        output += `📊 *RECENT RESULTS*\n`;
        globalMatches.forEach(m => {
          const home = m.homeTeam.shortName || m.homeTeam.name;
          const away = m.awayTeam.shortName || m.awayTeam.name;
          const homeGoals = m.score.fullTime.home ?? 0;
          const awayGoals = m.score.fullTime.away ?? 0;

          output += `\n*${home}* ${homeGoals} - ${awayGoals} *${away}*\n`;
        });
        output += `\n------------------------------------\n`;
      }

      if (includeTable && globalStandings.length > 0) {
        output += `🏆 *STANDINGS*\n\n`;
        globalStandings.slice(0, 10).forEach(row => {
          const pos = row.position;
          const team = row.team.shortName || row.team.name;
          const pts = row.points;
          const gd = row.goalDifference > 0 ? `+${row.goalDifference}` : row.goalDifference;

          output += `${pos}. *${team}* — ${pts}pts (${gd})\n`;
        });
      }

      document.getElementById('whatsappOutput').value = output.trim();
    }

    function copyToClipboard() {
      const textarea = document.getElementById('whatsappOutput');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      alert("Text copied!");
    }

    function shareToWhatsApp() {
      const text = document.getElementById('whatsappOutput').value;
      if (!text) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
</body>
</html>
