<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footy Sharer - WhatsApp Results & Tables</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚽</span>
        <h1 class="text-xl font-bold text-white">Footy Sharer</h1>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
        Live API Connected
      </span>
    </div>

    <!-- Controls & Selection -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- League Selector -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Competition</label>
          <select id="leagueSelect" onchange="fetchData()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="39">Premier League</option>
            <option value="2">UEFA Champions League</option>
          </select>
        </div>

        <!-- Season Selector -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Season</label>
          <select id="seasonSelect" onchange="fetchData()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="2026" selected>2026/2027</option>
            <option value="2025">2025/2026</option>
            <option value="2024">2024/2025</option>
          </select>
        </div>

      </div>

      <!-- Content Include Options -->
      <div class="flex flex-wrap items-center gap-6 pt-2 border-t border-slate-700/50">
        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
          <input type="checkbox" id="includeResults" checked onchange="updatePreview()" class="accent-emerald-500 w-4 h-4 rounded">
          Include Match Results & Scorers
        </label>
        <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
          <input type="checkbox" id="includeTable" checked onchange="updatePreview()" class="accent-emerald-500 w-4 h-4 rounded">
          Include League Table
        </label>
      </div>
    </div>

    <!-- Live Preview Box -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold uppercase text-slate-400">WhatsApp Text Preview</h2>
        <span id="loadingIndicator" class="hidden text-xs text-emerald-400 animate-pulse">Fetching live data...</span>
      </div>

      <textarea id="whatsappOutput" readonly rows="13" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-sm text-slate-200 outline-none resize-none focus:border-emerald-500" placeholder="Loading data..."></textarea>

      <!-- Action Buttons -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
        <button onclick="copyToClipboard()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2 transition text-sm">
          📋 Copy Text
        </button>
        <button onclick="shareToWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2 transition text-sm">
          💬 Share to WhatsApp
        </button>
      </div>
    </div>

  </div>

  <script>
    // Embedded API-Football Key
    const API_KEY = "2ebf1e836cad811f8a03c345bbb9bd22";

    let globalFixtures = [];
    let globalStandings = [];

    window.onload = () => {
      fetchData();
    };

    async function fetchData() {
      const leagueId = document.getElementById('leagueSelect').value;
      const season = document.getElementById('seasonSelect').value;
      const loading = document.getElementById('loadingIndicator');

      loading.classList.remove('hidden');

      try {
        // Fetch Last 10 Finished Matches
        const fixturesRes = await fetch(`https://v3.football.api-sports.io/fixtures?league=${leagueId}&season=${season}&last=10`, {
          headers: { 'x-apisports-key': API_KEY }
        });
        const fixturesData = await fixturesRes.json();
        globalFixtures = fixturesData.response || [];

        // Fetch Detailed Goal Events (Goalscorers)
        for (let fix of globalFixtures) {
          if (fix.fixture.id) {
            const eventRes = await fetch(`https://v3.football.api-sports.io/fixtures/events?fixture=${fix.fixture.id}&type=Goal`, {
              headers: { 'x-apisports-key': API_KEY }
            });
            const eventData = await eventRes.json();
            fix.goalsEvents = eventData.response || [];
          }
        }

        // Fetch League Standings
        const standingsRes = await fetch(`https://v3.football.api-sports.io/standings?league=${leagueId}&season=${season}`, {
          headers: { 'x-apisports-key': API_KEY }
        });
        const standingsData = await standingsRes.json();
        globalStandings = standingsData.response?.[0]?.league?.standings || [];

        updatePreview();

      } catch (err) {
        alert("Error fetching live data. Please check network connection.");
        console.error(err);
      } finally {
        loading.classList.add('hidden');
      }
    }

    function updatePreview() {
      const leagueName = document.getElementById('leagueSelect').options[document.getElementById('leagueSelect').selectedIndex].text;
      const includeResults = document.getElementById('includeResults').checked;
      const includeTable = document.getElementById('includeTable').checked;

      let output = `⚽ *${leagueName.toUpperCase()} UPDATE* ⚽\n\n`;

      // 1. Format Fixtures & Scorers
      if (includeResults && globalFixtures.length > 0) {
        output += `📊 *RECENT RESULTS*\n`;
        
        globalFixtures.forEach(fix => {
          const home = fix.teams.home.name;
          const away = fix.teams.away.name;
          const homeGoals = fix.goals.home ?? 0;
          const awayGoals = fix.goals.away ?? 0;

          output += `\n*${home}* ${homeGoals} - ${awayGoals} *${away}*\n`;

          // Format Goalscorers
          if (fix.goalsEvents && fix.goalsEvents.length > 0) {
            const homeScorers = [];
            const awayScorers = [];

            fix.goalsEvents.forEach(e => {
              const minute = e.time.elapsed + (e.time.extra ? `+${e.time.extra}` : '');
              const detail = e.detail === 'Penalty' ? ' (P)' : e.detail === 'Own Goal' ? ' (OG)' : '';
              const scorer = `${e.player.name} ${minute}'${detail}`;

              if (e.team.id === fix.teams.home.id) {
                homeScorers.push(scorer);
              } else {
                awayScorers.push(scorer);
              }
            });

            const homeText = homeScorers.length > 0 ? homeScorers.join(', ') : '-';
            const awayText = awayScorers.length > 0 ? awayScorers.join(', ') : '-';

            output += `⚽ _${homeText} | ${awayText}_\n`;
          }
        });

        output += `\n------------------------------------\n`;
      }

      // 2. Format Standings
      if (includeTable && globalStandings.length > 0) {
        output += `🏆 *STANDINGS*\n\n`;

        const tableGroup = Array.isArray(globalStandings[0]) ? globalStandings[0] : globalStandings;

        tableGroup.slice(0, 10).forEach(row => {
          const pos = row.rank;
          const team = row.team.name;
          const pts = row.points;
          const gd = row.goalsDiff > 0 ? `+${row.goalsDiff}` : row.goalsDiff;

          output += `${pos}. *${team}* — ${pts}pts (${gd})\n`;
        });
      }

      document.getElementById('whatsappOutput').value = output.trim();
    }

    function copyToClipboard() {
      const textarea = document.getElementById('whatsappOutput');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      alert("Text copied to clipboard!");
    }

    function shareToWhatsApp() {
      const text = document.getElementById('whatsappOutput').value;
      if (!text) return;
      const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
